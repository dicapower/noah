name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            d=noah-${GITHUB_REF_NAME}-${os}-${arch}
            mkdir "$d"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$d/noah$ext" ./cmd/noah
            cp LICENSE NOTICE README.md "$d/"
            if [ "$os" = windows ]; then zip -qr "dist/$d.zip" "$d"
            else tar -czf "dist/$d.tar.gz" "$d"; fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "noah $GITHUB_REF_NAME" --notes-file <(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## v"v"$"{f=1;next} /^## v/{f=0} f' CHANGELOG.md)
