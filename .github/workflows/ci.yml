name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Read-only by default: CI never needs to write to the repository.
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/noah
  recall:
    # Search quality is part of the contract: a ranking change that makes noah
    # miss an answer fails here. Runs the larger 10,000-memory case too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: NOAH_RECALL_N=10000 go test ./internal/search -run 'TestRecall' -v -count=1

  install:
    # Proves the one-line installers work on a clean machine, against the
    # latest published release.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          NOAH_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/noah" version
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NOAH_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          ./install.ps1
          & (Join-Path $env:NOAH_INSTALL_DIR 'noah.exe') version
