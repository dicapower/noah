  <g fill="#e6e9ef">
    <rect x="240" y="428" width="32" height="14" rx="7"/>
    <circle cx="238" cy="430" r="7"/><circle cx="238" cy="440" r="7"/>
    <circle cx="274" cy="430" r="7"/><circle cx="274" cy="440" r="7"/>
