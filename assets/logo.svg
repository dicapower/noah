  <path fill="#0c0c0f" d="M 226 304 C 226 290 240 284 256 284 C 272 284 286 290 286 304 C 286 320 272 328 256 328 C 240 328 226 320 226 304 Z"/>
  <ellipse cx="246" cy="295" rx="8" ry="3.5" fill="#fff" opacity="0.3"/>
