<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="noah logo: a black and tan Rottweiler">
  <title>noah</title>
  <rect width="512" height="512" rx="96" fill="#f3ead7"/>
