  <path fill="#1c1c21" d="M 110 512 C 110 424 164 386 256 386 C 348 386 402 424 402 512 Z"/>
  <ellipse cx="226" cy="466" rx="13" ry="18" fill="#b8692f"/>
  <ellipse cx="286" cy="466" rx="13" ry="18" fill="#b8692f"/>
