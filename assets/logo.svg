  <path d="M 256 328 L 256 346 M 256 346 C 242 364 220 362 212 350 M 256 346 C 270 364 292 362 300 350" stroke="#0c0c0f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
