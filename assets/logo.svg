    C 176 196 204 168 244 160
    L 336 156
    C 352 156 360 168 364 188
    L 370 206
    C 400 208 432 210 448 216
    C 460 222 462 238 458 252
    C 456 264 448 270 440 272
    C 446 292 436 310 418 318
    C 408 334 388 342 366 338
    C 348 336 336 332 322 334
    C 322 366 330 410 346 452 Z"/>
  <!-- Drop ear: gap line separating it from the skull -->
  <path d="M 214 176 C 236 232 262 258 296 262 C 304 232 306 200 300 168" fill="#14181f" stroke="#14181f" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 226 184 C 244 226 266 244 288 248 C 292 224 292 200 288 178 Z" fill="#f2f4f8" opacity="0.0"/>
  <!-- Eye + brow -->
