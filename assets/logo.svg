  <ellipse cx="206" cy="226" rx="13" ry="9" fill="#b8692f"/>
  <ellipse cx="306" cy="226" rx="13" ry="9" fill="#b8692f"/>
  <!-- eyes -->
  <ellipse cx="208" cy="258" rx="12" ry="13" fill="#4a3022"/>
  <ellipse cx="304" cy="258" rx="12" ry="13" fill="#4a3022"/>
  <circle cx="212" cy="253" r="4" fill="#fff"/>
  <circle cx="308" cy="253" r="4" fill="#fff"/>
